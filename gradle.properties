# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# SMS Gateway login: put SMSGATEWAY_USERNAME / SMSGATEWAY_PASSWORD in local.properties
# (that file is never uploaded to GitHub). Left empty here on purpose.
SMSGATEWAY_USERNAME=
SMSGATEWAY_PASSWORD=

# AndroidX Support
android.useAndroidX=true
android.enableJetifier=false
